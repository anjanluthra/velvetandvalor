<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Orders &amp; Revenue — V&amp;V Admin</title>
  <link rel="stylesheet" href="/css/style.css?v=v2026-07-13" />
  <link rel="stylesheet" href="/css/admin.css" />
  <style>
    body { padding: 0; }
    .admin-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 32px;
      border-bottom: 1px solid var(--gold-muted);
      background: var(--obsidian-mid);
      position: sticky; top: 0; z-index: 10;
    }
    .admin-bar .brand {
      font-family: var(--font-serif); font-size: 1.2rem; color: var(--cream);
    }
    .admin-bar .brand span { color: var(--gold-pale); font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; margin-left: 10px; }
    .admin-bar .actions { display: flex; gap: 12px; align-items: center; }
    .btn-ghost {
      padding: 8px 16px; border: 1px solid var(--gold-muted); border-radius: 8px;
      color: var(--cream-mid); font-size: 0.85rem; transition: 0.2s var(--ease-out);
    }
    .btn-ghost:hover { border-color: var(--gold-bright); color: var(--cream); }

    .wrap { max-width: 1320px; margin: 0 auto; padding: 32px; }

    /* Summary cards */
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; margin-bottom: 36px; }
    .card {
      background: var(--obsidian-mid); border: 1px solid var(--gold-subtle);
      border-radius: 12px; padding: 20px 22px;
    }
    .card .label { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cream-muted); }
    .card .value { font-family: var(--font-serif); font-size: 1.9rem; color: var(--cream); margin-top: 8px; }
    .card .value.gold { color: var(--gold-pale); }
    .card .value.warn { color: #ffcf8b; }

    /* Controls */
    .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 18px; }
    .filters { display: flex; gap: 8px; }
    .filter {
      padding: 7px 14px; border: 1px solid var(--gold-muted); border-radius: 999px;
      font-size: 0.82rem; color: var(--cream-mid); transition: 0.2s var(--ease-out);
    }
    .filter.active { background: var(--gold); color: var(--obsidian-deep); border-color: var(--gold); font-weight: 600; }
    .search {
      margin-left: auto; padding: 9px 14px; min-width: 240px;
      background: var(--obsidian-mid); border: 1px solid var(--gold-muted);
      border-radius: 8px; color: var(--cream); font-size: 0.88rem;
    }
    .date-range { display: flex; align-items: center; gap: 8px; }
    .date-label { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--cream-muted); }
    .date-range input[type="date"] {
      padding: 8px 10px; background: var(--obsidian-mid); border: 1px solid var(--gold-muted);
      border-radius: 8px; color: var(--cream); font-size: 0.82rem; color-scheme: dark;
    }
    .date-range input[type="date"]:focus { border-color: var(--gold-bright); }
    .date-clear { font-size: 0.78rem; color: var(--cream-muted); text-decoration: underline; cursor: pointer; }
    .date-clear:hover { color: var(--cream); }

    /* Table */
    .table-wrap { background: var(--obsidian-mid); border: 1px solid var(--gold-subtle); border-radius: 12px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 14px 18px; font-size: 0.88rem; }
    th { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--cream-muted); border-bottom: 1px solid var(--gold-subtle); }
    tbody tr { border-bottom: 1px solid var(--gold-whisper); }
    tbody tr.main-row { cursor: pointer; }
    tbody tr.main-row:hover { background: var(--obsidian-light); }
    td .muted { color: var(--cream-muted); font-size: 0.8rem; }
    .amount { font-variant-numeric: tabular-nums; font-weight: 600; }
    .amount.refunded { color: #ff9a9a; text-decoration: line-through; opacity: 0.7; }

    .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.03em; }
    .badge.shipped { background: rgba(60, 200, 140, 0.16); color: #6fe0ad; }
    .badge.unfulfilled { background: rgba(255, 207, 139, 0.14); color: #ffcf8b; }
    .badge.refund { background: rgba(255, 154, 154, 0.14); color: #ff9a9a; margin-left: 6px; }
    .badge.custom { background: rgba(34, 170, 170, 0.20); color: var(--gold-pale); }
    .badge.standard { background: rgba(255, 255, 255, 0.07); color: var(--cream-muted); }

    .custom-section { grid-column: 1 / -1; border-top: 1px solid var(--gold-whisper); padding-top: 16px; }
    .custom-section h4 { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold-pale); margin-bottom: 8px; }
    .custom-section .kv { font-size: 0.88rem; line-height: 1.9; }
    .custom-section .kv b { color: var(--cream-muted); font-weight: 500; display: inline-block; min-width: 70px; }
    .photos { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .photo-thumb { display: block; width: 96px; height: 96px; border-radius: 8px; overflow: hidden; border: 1px solid var(--gold-muted); transition: border-color 0.2s var(--ease-out); }
    .photo-thumb:hover { border-color: var(--gold-bright); }
    .photo-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .photo-links { margin-top: 10px; font-size: 0.78rem; color: var(--cream-muted); }

    .btn-ship {
      padding: 7px 14px; background: var(--gold); color: var(--obsidian-deep);
      border-radius: 8px; font-size: 0.8rem; font-weight: 600; transition: 0.2s var(--ease-out);
    }
    .btn-ship:hover { background: var(--gold-bright); }
    .btn-undo { font-size: 0.76rem; color: var(--cream-muted); text-decoration: underline; margin-left: 10px; }
    .btn-undo:hover { color: var(--cream); }

    /* Detail row */
    .detail-row td { background: var(--obsidian-deep); padding: 0; }
    .detail-inner { padding: 20px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .detail-inner h4 { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold-pale); margin-bottom: 8px; }
    .detail-inner .kv { font-size: 0.88rem; line-height: 1.9; }
    .detail-inner .kv b { color: var(--cream-muted); font-weight: 500; display: inline-block; min-width: 90px; }
    .copy { cursor: pointer; }
    .copy:hover { color: var(--gold-pale); }
    .track-row { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; border-top: 1px solid var(--gold-whisper); padding-top: 16px; }
    .track-row input { flex: 1; max-width: 320px; padding: 9px 12px; background: var(--obsidian-mid); border: 1px solid var(--gold-muted); border-radius: 8px; color: var(--cream); font-size: 0.85rem; }
    .track-row button { padding: 9px 16px; border: 1px solid var(--gold-muted); border-radius: 8px; color: var(--cream-mid); font-size: 0.82rem; }
    .track-row button:hover { border-color: var(--gold-bright); color: var(--cream); }

    .state { padding: 60px; text-align: center; color: var(--cream-muted); }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(4, 13, 28, 0.72); backdrop-filter: blur(3px);
      display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      width: 100%; max-width: 420px; background: var(--obsidian-mid);
      border: 1px solid var(--gold-muted); border-radius: 14px; padding: 28px;
    }
    .modal h3 { font-family: var(--font-serif); font-weight: 500; color: var(--cream); font-size: 1.3rem; margin-bottom: 6px; }
    .modal-product { color: var(--gold-pale); font-size: 0.95rem; margin-bottom: 20px; }
    .modal-label { display: block; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--cream-muted); margin-bottom: 7px; }
    .modal input { width: 100%; padding: 12px 14px; background: var(--obsidian-deep); border: 1px solid var(--gold-muted); border-radius: 8px; color: var(--cream); font-size: 0.92rem; }
    .modal input:focus { border-color: var(--gold-bright); }
    .modal-note { font-size: 0.83rem; color: var(--cream-mid); margin: 14px 0 0; line-height: 1.6; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
    .modal-cancel { padding: 11px 18px; border: 1px solid var(--gold-muted); border-radius: 8px; color: var(--cream-mid); font-size: 0.88rem; }
    .modal-cancel:hover { border-color: var(--cream-muted); color: var(--cream); }
    .modal-confirm { padding: 11px 20px; background: var(--gold); color: var(--obsidian-deep); border-radius: 8px; font-weight: 600; font-size: 0.88rem; }
    .modal-confirm:hover:not(:disabled) { background: var(--gold-bright); }
    .modal-confirm:disabled { opacity: 0.6; cursor: default; }
    .modal-check { display: flex; align-items: center; gap: 9px; margin-top: 16px; font-size: 0.86rem; color: var(--cream-mid); cursor: pointer; user-select: none; }
    .modal-check input { width: 18px; height: 18px; accent-color: var(--gold); cursor: pointer; flex: none; }
    .modal-check.disabled { opacity: 0.5; cursor: not-allowed; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--obsidian-surface); border: 1px solid var(--gold-muted); color: var(--cream);
      padding: 12px 22px; border-radius: 10px; font-size: 0.88rem; opacity: 0; pointer-events: none;
      transition: 0.3s var(--ease-out); z-index: 50;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (max-width: 720px) {
      th.hide-sm, td.hide-sm { display: none; }
      .detail-inner { grid-template-columns: 1fr; }
      .cards { grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 24px; }
      .card { padding: 14px 15px; }
      .card .value { font-size: 1.45rem; }
      .controls .search { margin-left: 0; min-width: 0; width: 100%; order: 3; }
      .date-range { flex-wrap: wrap; }
      .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      table { min-width: 580px; }
      th, td { padding: 11px 12px; font-size: 0.82rem; }
    }
  </style>
</head>
<body>
  <div class="admin-layout">
  <aside id="adminSidebar"></aside>
  <main class="admin-main">
  <div class="wrap">
    <div class="page-head">
      <h1>Orders &amp; Revenue</h1>
      <div class="actions">
        <button class="btn-ghost" id="exportBtn" title="Copy orders and open a new Google Sheet">⤓ Export to Sheets</button>
        <button class="btn-ghost" id="refreshBtn">Refresh</button>
      </div>
    </div>
    <div class="cards" id="cards"></div>

    <div class="controls">
      <div class="filters">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="unfulfilled">To Ship</button>
        <button class="filter" data-filter="shipped">Shipped</button>
      </div>
      <div class="date-range">
        <span class="date-label">From</span>
        <input type="date" id="dateFrom" />
        <span class="date-label">To</span>
        <input type="date" id="dateTo" />
        <a class="date-clear" id="dateClear" style="display:none">Clear</a>
      </div>
      <input class="search" id="search" type="search" placeholder="Search name, email, SKU…" />
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Order</th>
            <th class="hide-sm">Customer</th>
            <th>Amount</th>
            <th>Fulfillment</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="5" class="state">Loading orders…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
  </main>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-overlay" id="shipModal">
    <div class="modal">
      <h3>Mark order as shipped?</h3>
      <p class="modal-product" id="shipModalProduct"></p>
      <label class="modal-label" for="shipModalDelivery">Estimated delivery date (optional)</label>
      <input type="date" id="shipModalDelivery" autocomplete="off" />
      <label class="modal-check" id="shipModalNotifyRow">
        <input type="checkbox" id="shipModalNotify" checked />
        <span>Email a shipping confirmation to the customer</span>
      </label>
      <p class="modal-note" id="shipModalEmail"></p>
      <div class="modal-actions">
        <button class="modal-cancel" id="shipModalCancel">Cancel</button>
        <button class="modal-confirm" id="shipModalConfirm">Confirm &amp; Notify Customer</button>
      </div>
    </div>
  </div>

  <script>
    let ORDERS = [];
    let SUMMARY = null;
    let FILTER = 'all';
    let QUERY = '';
    let CAN_SEE_MONEY = true;
    let DATE_FROM = '';
    let DATE_TO = '';
    const expanded = new Set();

    const fmtMoney = (cents, currency) =>
      new Intl.NumberFormat('en-US', { style: 'currency', currency: currency || 'USD' }).format((cents || 0) / 100);
    const fmtDate = (unixSec) =>
      new Date(unixSec * 1000).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    const esc = (s) => String(s || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    function toast(msg, ms) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._t);
      t._t = setTimeout(() => t.classList.remove('show'), ms || 2200);
    }

    // Orders within the selected date range (drives headline numbers).
    function inDateRange(o) {
      if (DATE_FROM) { const f = new Date(DATE_FROM + 'T00:00:00').getTime() / 1000; if (o.created < f) return false; }
      if (DATE_TO) { const t = new Date(DATE_TO + 'T23:59:59').getTime() / 1000; if (o.created > t) return false; }
      return true;
    }
    function dateScopedOrders() { return ORDERS.filter(inDateRange); }
    function computeSummary(list) {
      const gross = list.reduce((s, o) => s + (o.amount || 0), 0);
      const refunds = list.reduce((s, o) => s + (o.refunded || 0), 0);
      return {
        currency: (SUMMARY && SUMMARY.currency) || (list[0] && list[0].currency) || 'USD',
        gross, refunds, net: gross - refunds,
        orderCount: list.length,
        unfulfilledCount: list.filter((o) => o.fulfillment.status !== 'shipped').length,
      };
    }

    async function load() {
      try {
        const r = await fetch('/api/admin/orders');
        if (r.status === 401) { window.location.href = '/admin/login'; return; }
        if (!r.ok) throw new Error('load failed');
        const data = await r.json();
        ORDERS = data.orders || [];
        SUMMARY = data.summary || null;
        CAN_SEE_MONEY = data.canSeeMoney !== false;
        renderCards();
        renderRows();
      } catch {
        document.getElementById('rows').innerHTML =
          '<tr><td colspan="5" class="state">Could not load orders. Try Refresh.</td></tr>';
      }
    }

    function renderCards() {
      if (!SUMMARY) return;
      const s = computeSummary(dateScopedOrders());
      const c = s.currency;
      const dateLabel = (DATE_FROM || DATE_TO) ? ' (in range)' : '';
      const cards = CAN_SEE_MONEY
        ? [
            { label: 'Gross Revenue' + dateLabel, value: fmtMoney(s.gross, c), cls: 'gold' },
            { label: 'Refunds', value: fmtMoney(s.refunds, c), cls: s.refunds ? 'warn' : '' },
            { label: 'Net Sales', value: fmtMoney(s.net, c), cls: '' },
            { label: 'Orders' + dateLabel, value: s.orderCount, cls: '' },
            { label: 'To Ship', value: s.unfulfilledCount, cls: s.unfulfilledCount ? 'warn' : '' },
          ]
        : [
            { label: 'Orders' + dateLabel, value: s.orderCount, cls: '' },
            { label: 'To Ship', value: s.unfulfilledCount, cls: s.unfulfilledCount ? 'warn' : '' },
          ];
      document.getElementById('cards').innerHTML = cards.map((k) =>
        `<div class="card"><div class="label">${k.label}</div><div class="value ${k.cls}">${k.value}</div></div>`
      ).join('');
    }

    function visibleOrders() {
      return ORDERS.filter((o) => {
        if (!inDateRange(o)) return false;
        const isShipped = o.fulfillment.status === 'shipped';
        if (FILTER === 'shipped' && !isShipped) return false;
        if (FILTER === 'unfulfilled' && isShipped) return false;
        if (QUERY) {
          const hay = [o.customer.name, o.customer.email, o.product.sku, o.product.design, o.product.model, o.custom && o.custom.horseName, o.isCustom ? 'custom' : 'standard']
            .filter(Boolean).join(' ').toLowerCase();
          if (!hay.includes(QUERY)) return false;
        }
        return true;
      });
    }

    function renderRows() {
      const rows = visibleOrders();
      const tbody = document.getElementById('rows');
      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="state">No matching orders.</td></tr>';
        return;
      }
      tbody.innerHTML = rows.map((o) => {
        const shipped = o.fulfillment.status === 'shipped';
        const product = [o.product.design, o.product.model, o.product.finish].filter(Boolean).join(' · ') || '—';
        const typeBadge = o.isCustom
          ? '<span class="badge custom">Custom</span>'
          : '<span class="badge standard">Standard</span>';
        const subline = o.isCustom
          ? (o.custom && o.custom.horseName ? '🐴 ' + esc(o.custom.horseName) : 'Custom portrait')
          : esc(o.product.sku);
        const refundBadge = o.refunded ? '<span class="badge refund">Refunded</span>' : '';
        const amountCell = CAN_SEE_MONEY
          ? `<span class="amount ${o.refunded ? 'refunded' : ''}">${fmtMoney(o.amount, o.currency)}</span> ${refundBadge}`
          : '<span class="muted">—</span>';
        const fulfillCell = shipped
          ? `<span class="badge shipped">✓ Shipped${o.fulfillment.shippedAt ? ' · ' + fmtDate(o.fulfillment.shippedAt / 1000) : ''}</span>
             <a class="btn-undo" data-undo="${o.id}">undo</a>`
          : `<button class="btn-ship" data-ship="${o.id}">Mark Shipped</button>`;
        const detail = expanded.has(o.id) ? detailRow(o) : '';
        return `
          <tr class="main-row" data-row="${o.id}">
            <td><span class="muted">${fmtDate(o.created)}</span></td>
            <td>${typeBadge} ${esc(product)}<br><span class="muted">${subline}</span></td>
            <td class="hide-sm">${esc(o.customer.name) || '—'}<br><span class="muted">${esc(o.customer.email)}</span></td>
            <td>${amountCell}</td>
            <td>${fulfillCell}</td>
          </tr>
          ${detail}`;
      }).join('');
    }

    function detailRow(o) {
      const s = o.shipping;
      const addr = [s.line1, s.line2, [s.city, s.state, s.postal].filter(Boolean).join(', '), s.country]
        .filter(Boolean).map(esc).join('<br>') || '—';
      return `
        <tr class="detail-row" data-detail="${o.id}">
          <td colspan="5">
            <div class="detail-inner">
              <div>
                <h4>Customer</h4>
                <div class="kv">
                  <div><b>Name</b> ${esc(o.customer.name) || '—'}</div>
                  <div><b>Email</b> <span class="copy" data-copy="${esc(o.customer.email)}">${esc(o.customer.email) || '—'}</span></div>
                  <div><b>Phone</b> ${esc(o.customer.phone) || '—'}</div>
                </div>
              </div>
              <div>
                <h4>Ship To</h4>
                <div class="kv">
                  <div><b>${esc(s.name) || '—'}</b></div>
                  <div>${addr}</div>
                </div>
              </div>
              ${o.isCustom ? customSection(o) : ''}
              <div class="track-row">
                <input type="text" placeholder="Tracking number (optional)" value="${esc(o.fulfillment.tracking)}" data-track-input="${o.id}" />
                <button data-track-save="${o.id}">Save tracking</button>
                <span class="muted" style="margin-left:auto">Order ${esc(o.id)}</span>
              </div>
            </div>
          </td>
        </tr>`;
    }

    function customSection(o) {
      const c = o.custom || {};
      const photos = (c.photos || []).map((u, i) =>
        `<a href="${esc(u)}" target="_blank" rel="noopener" class="photo-thumb" title="Open full image"><img src="${esc(u)}" alt="Customer photo ${i + 1}" loading="lazy" /></a>`
      ).join('');
      return `
        <div class="custom-section">
          <h4>Custom Portrait — customer upload</h4>
          <div class="kv">
            ${c.horseName ? `<div><b>Horse</b> ${esc(c.horseName)}</div>` : ''}
            ${c.initials ? `<div><b>Initials</b> ${esc(c.initials)}</div>` : ''}
            ${c.notes ? `<div><b>Notes</b> ${esc(c.notes)}</div>` : ''}
          </div>
          ${photos
            ? `<div class="photos">${photos}</div>
               <div class="photo-links">${(c.photos || []).map((u, i) => `<a class="copy" data-copy="${esc(u)}">Copy image ${i + 1} URL</a>`).join(' · ')}</div>`
            : '<div class="muted">No photo URL stored on this order.</div>'}
        </div>`;
    }

    async function setShipped(id, shipped, tracking, notify, deliveryDate) {
      const order = ORDERS.find((o) => o.id === id);
      try {
        const r = await fetch('/api/admin/ship', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId: id, shipped, tracking, notify: !!notify, deliveryDate: deliveryDate || '' }),
        });
        if (r.status === 401) { window.location.href = '/admin/login'; return; }
        if (!r.ok) throw new Error('update failed');
        const data = await r.json();
        if (order) order.fulfillment = data.fulfillment;
        SUMMARY.unfulfilledCount = ORDERS.filter((o) => o.fulfillment.status !== 'shipped').length;
        renderCards();
        renderRows();
        if (!shipped) toast('Moved back to To Ship');
        else if (notify && data.emailed) toast('Shipped — confirmation email sent to customer');
        else if (notify && data.emailError) toast('Marked shipped, but email failed: ' + esc(data.emailError), true);
        else toast('Marked as shipped');
      } catch {
        toast('Could not update order');
      }
    }

    // ── Mark-shipped confirmation modal ──
    let SHIP_TARGET = null;
    function openShipModal(id) {
      const o = ORDERS.find((x) => x.id === id);
      if (!o) return;
      SHIP_TARGET = id;
      const product = [o.product.design, o.product.model, o.product.finish].filter(Boolean).join(' · ') || (o.isCustom ? 'Custom portrait' : 'Order');
      document.getElementById('shipModalProduct').textContent = product;
      const email = o.customer.email;
      const notify = document.getElementById('shipModalNotify');
      const notifyRow = document.getElementById('shipModalNotifyRow');
      // No email on file → can't notify; lock the checkbox off.
      notify.checked = !!email;
      notify.disabled = !email;
      notifyRow.classList.toggle('disabled', !email);
      notifyRow.dataset.email = email || '';
      const dd = document.getElementById('shipModalDelivery');
      dd.value = o.fulfillment.estimatedDelivery || '';
      syncShipModalUI();
      document.getElementById('shipModal').classList.add('open');
      setTimeout(() => dd.focus(), 50);
    }
    // Reflect the notify checkbox in the helper note + confirm button label.
    function syncShipModalUI() {
      const notify = document.getElementById('shipModalNotify');
      const email = document.getElementById('shipModalNotifyRow').dataset.email || '';
      const emailEl = document.getElementById('shipModalEmail');
      const btn = document.getElementById('shipModalConfirm');
      if (!email) {
        emailEl.innerHTML = '<span style="color:#ffcf8b">No email on this order — it will be marked shipped without notifying.</span>';
        btn.textContent = 'Mark Shipped';
      } else if (notify.checked) {
        emailEl.innerHTML = 'A shipping confirmation email will be sent to <b>' + esc(email) + '</b>.';
        btn.textContent = 'Confirm & Notify Customer';
      } else {
        emailEl.innerHTML = 'No email will be sent — the order is just marked shipped.';
        btn.textContent = 'Mark Shipped (no email)';
      }
    }
    function closeShipModal() { document.getElementById('shipModal').classList.remove('open'); SHIP_TARGET = null; }
    async function confirmShip() {
      if (!SHIP_TARGET) return;
      const id = SHIP_TARGET;
      // Tracking is managed in the order detail row, not this popup — preserve any existing value.
      const order = ORDERS.find((o) => o.id === id) || {};
      const tracking = (order.fulfillment && order.fulfillment.tracking) || '';
      const deliveryDate = document.getElementById('shipModalDelivery').value;
      const notify = document.getElementById('shipModalNotify').checked;
      const btn = document.getElementById('shipModalConfirm');
      btn.disabled = true; btn.textContent = notify ? 'Shipping…' : 'Marking…';
      await setShipped(id, true, tracking, notify, deliveryDate);
      btn.disabled = false; syncShipModalUI();
      closeShipModal();
    }

    // Event delegation
    document.getElementById('rows').addEventListener('click', (e) => {
      const ship = e.target.closest('[data-ship]');
      if (ship) { e.stopPropagation(); openShipModal(ship.dataset.ship); return; }
      const undo = e.target.closest('[data-undo]');
      if (undo) { e.stopPropagation(); setShipped(undo.dataset.undo, false); return; }
      const save = e.target.closest('[data-track-save]');
      if (save) {
        e.stopPropagation();
        const id = save.dataset.trackSave;
        const input = document.querySelector(`[data-track-input="${id}"]`);
        setShipped(id, true, input ? input.value.trim() : '', false);
        toast('Tracking saved');
        return;
      }
      const copy = e.target.closest('[data-copy]');
      if (copy) { e.stopPropagation(); navigator.clipboard?.writeText(copy.dataset.copy); toast('Copied'); return; }
      if (e.target.closest('[data-track-input]')) { e.stopPropagation(); return; }
      const row = e.target.closest('[data-row]');
      if (row) {
        const id = row.dataset.row;
        if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
        renderRows();
      }
    });

    document.querySelectorAll('.filter').forEach((b) =>
      b.addEventListener('click', () => {
        document.querySelectorAll('.filter').forEach((x) => x.classList.remove('active'));
        b.classList.add('active');
        FILTER = b.dataset.filter;
        renderRows();
      })
    );

    document.getElementById('search').addEventListener('input', (e) => {
      QUERY = e.target.value.trim().toLowerCase();
      renderRows();
    });

    document.getElementById('refreshBtn').addEventListener('click', load);

    // ── Date range ──
    function onDateChange() {
      DATE_FROM = document.getElementById('dateFrom').value;
      DATE_TO = document.getElementById('dateTo').value;
      document.getElementById('dateClear').style.display = (DATE_FROM || DATE_TO) ? '' : 'none';
      renderCards();
      renderRows();
    }
    document.getElementById('dateFrom').addEventListener('change', onDateChange);
    document.getElementById('dateTo').addEventListener('change', onDateChange);
    document.getElementById('dateClear').addEventListener('click', () => {
      document.getElementById('dateFrom').value = '';
      document.getElementById('dateTo').value = '';
      onDateChange();
    });

    // ── Export to Google Sheets (copies TSV, opens a fresh sheet to paste) ──
    function buildExport() {
      const list = dateScopedOrders();
      const cols = ['Date', 'Type', 'Product', 'SKU', 'Horse', 'Initials', 'Customer', 'Email', 'Phone', 'Ship To', 'Country'];
      if (CAN_SEE_MONEY) cols.push('Amount', 'Refunded');
      cols.push('Status', 'Tracking', 'Order ID');
      const rows = list.map((o) => {
        const sh = o.shipping || {};
        const addr = [sh.line1, sh.line2, sh.city, sh.state, sh.postal].filter(Boolean).join(', ');
        const r = [
          fmtDate(o.created),
          o.isCustom ? 'Custom' : 'Standard',
          [o.product.design, o.product.model, o.product.finish].filter(Boolean).join(' '),
          o.product.sku || '',
          (o.custom && o.custom.horseName) || '',
          (o.custom && o.custom.initials) || '',
          o.customer.name || '',
          o.customer.email || '',
          o.customer.phone || '',
          addr,
          sh.country || '',
        ];
        if (CAN_SEE_MONEY) r.push(o.amount != null ? (o.amount / 100).toFixed(2) : '', o.refunded ? (o.refunded / 100).toFixed(2) : '0.00');
        r.push(o.fulfillment.status, o.fulfillment.tracking || '', o.id);
        return r;
      });
      const clean = (v) => String(v == null ? '' : v).replace(/[\t\n\r]/g, ' ');
      return { rows: list.length, tsv: [cols, ...rows].map((r) => r.map(clean).join('\t')).join('\n') };
    }
    // Synchronous copy — works even when a new tab is about to steal focus
    // (the async Clipboard API rejects once the document loses focus).
    function copyTextSync(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-9999px';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { ta.setSelectionRange(0, text.length); } catch (e) { /* ignore */ }
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      return ok;
    }
    function downloadCSV(filename, tsv) {
      const csv = tsv.split('\n')
        .map((line) => line.split('\t').map((c) => '"' + String(c).replace(/"/g, '""') + '"').join(','))
        .join('\n');
      const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    document.getElementById('exportBtn').addEventListener('click', () => {
      const { rows, tsv } = buildExport();
      if (!rows) { toast('No orders to export'); return; }
      // Copy FIRST (while this tab is focused), then open the sheet.
      const copied = copyTextSync(tsv);
      if (copied) {
        window.open('https://sheets.new', '_blank');
        toast('✓ Copied ' + rows + ' orders — click the new sheet and press ⌘V / Ctrl+V to paste', 8000);
      } else {
        downloadCSV('velvet-valor-orders.csv', tsv);
        toast('Downloaded ' + rows + ' orders as CSV — open in Google Sheets via File → Import', 7000);
      }
    });

    // Ship modal wiring
    document.getElementById('shipModalCancel').addEventListener('click', closeShipModal);
    document.getElementById('shipModalConfirm').addEventListener('click', confirmShip);
    document.getElementById('shipModalNotify').addEventListener('change', syncShipModalUI);
    document.getElementById('shipModal').addEventListener('click', (e) => {
      if (e.target.id === 'shipModal') closeShipModal();
    });
    document.getElementById('shipModalDelivery').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') confirmShip();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.getElementById('shipModal').classList.contains('open')) closeShipModal();
    });

    load();
  </script>
  <script src="/js/admin-nav.js"></script>
</body>
