<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin Login — Velvet &amp; Valor</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card {
      width: 100%;
      max-width: 360px;
      margin: 24px;
      padding: 40px 32px;
      background: var(--obsidian-mid);
      border: 1px solid var(--gold-muted);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }
    .login-card h1 {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      font-weight: 500;
      color: var(--cream);
    }
    .login-card .sub {
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold-pale);
      margin-top: -8px;
      margin-bottom: 8px;
    }
    .login-card input {
      width: 100%;
      padding: 14px 16px;
      background: var(--obsidian-deep);
      border: 1px solid var(--gold-muted);
      border-radius: 8px;
      color: var(--cream);
      font-size: 0.95rem;
    }
    .login-card input:focus { border-color: var(--gold-bright); }
    .login-card button {
      width: 100%;
      padding: 14px 16px;
      background: var(--gold);
      color: var(--obsidian-deep);
      border-radius: 8px;
      font-weight: 600;
      letter-spacing: 0.04em;
      transition: background 0.2s var(--ease-out);
    }
    .login-card button:hover:not(:disabled) { background: var(--gold-bright); }
    .login-card button:disabled { opacity: 0.6; cursor: default; }
    .err { color: #ff9a9a; font-size: 0.85rem; min-height: 1.1em; }
  </style>
</head>
<body>
  <form class="login-card" id="loginForm" autocomplete="on">
    <h1>Velvet &amp; Valor</h1>
    <div class="sub">Admin Access</div>
    <input type="email" id="email" placeholder="Email" autocomplete="username" required />
    <input type="password" id="password" placeholder="Password" autocomplete="current-password" required />
    <button type="submit">Sign In</button>
    <div class="err" id="err"></div>
  </form>

  <script>
    const form = document.getElementById('loginForm');
    const err = document.getElementById('err');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      const btn = form.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      try {
        const r = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        if (r.ok) {
          window.location.href = '/admin/dashboard';
          return;
        }
        const d = await r.json().catch(() => ({}));
        err.textContent = d.error || 'Login failed';
      } catch {
        err.textContent = 'Network error — please try again';
      }
      btn.disabled = false;
      btn.textContent = 'Sign In';
    });
  </script>
</body>
</html>
