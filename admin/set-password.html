<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Set Your Password — Velvet &amp; Valor</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card {
      width: 100%; max-width: 380px; margin: 24px; padding: 40px 32px;
      background: var(--obsidian-mid); border: 1px solid var(--gold-muted);
      border-radius: 14px; display: flex; flex-direction: column; gap: 16px; text-align: center;
    }
    .card h1 { font-family: var(--font-serif); font-size: 1.6rem; font-weight: 500; color: var(--cream); }
    .card .sub { font-size: 0.8rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold-pale); margin-top: -8px; }
    .card .who { font-size: 0.9rem; color: var(--cream-mid); margin-bottom: 4px; }
    .card input {
      width: 100%; padding: 14px 16px; background: var(--obsidian-deep);
      border: 1px solid var(--gold-muted); border-radius: 8px; color: var(--cream); font-size: 0.95rem;
    }
    .card input:focus { border-color: var(--gold-bright); }
    .card button {
      width: 100%; padding: 14px 16px; background: var(--gold); color: var(--obsidian-deep);
      border-radius: 8px; font-weight: 600; letter-spacing: 0.04em; transition: background 0.2s var(--ease-out);
    }
    .card button:hover:not(:disabled) { background: var(--gold-bright); }
    .card button:disabled { opacity: 0.6; cursor: default; }
    .err { color: #ff9a9a; font-size: 0.85rem; min-height: 1.1em; }
    .hint { color: var(--cream-muted); font-size: 0.78rem; }
    .center-msg { color: var(--cream-mid); font-size: 0.95rem; line-height: 1.7; }
    .center-msg a { color: var(--gold-pale); text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <h1>Velvet &amp; Valor</h1>
    <div class="sub">Set Your Password</div>
    <div class="center-msg" id="loading">Checking your invite…</div>
  </div>

  <script>
    const card = document.getElementById('card');
    const params = new URLSearchParams(location.search);
    const token = params.get('token');

    function showInvalid() {
      card.innerHTML =
        '<h1>Velvet &amp; Valor</h1>' +
        '<div class="sub">Set Your Password</div>' +
        '<div class="center-msg">This invite link is invalid or has expired.<br>Ask the store owner to send a new invitation.</div>';
    }

    function showForm(email) {
      card.innerHTML =
        '<h1>Velvet &amp; Valor</h1>' +
        '<div class="sub">Set Your Password</div>' +
        '<div class="who">' + email + '</div>' +
        '<input type="password" id="pw" placeholder="New password" autocomplete="new-password" />' +
        '<input type="password" id="pw2" placeholder="Confirm password" autocomplete="new-password" />' +
        '<button id="go">Set Password &amp; Sign In</button>' +
        '<div class="hint">At least 8 characters.</div>' +
        '<div class="err" id="err"></div>';
      document.getElementById('go').addEventListener('click', submit);
      document.getElementById('pw2').addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
    }

    async function submit() {
      const err = document.getElementById('err');
      const btn = document.getElementById('go');
      const pw = document.getElementById('pw').value;
      const pw2 = document.getElementById('pw2').value;
      err.textContent = '';
      if (pw.length < 8) { err.textContent = 'Password must be at least 8 characters'; return; }
      if (pw !== pw2) { err.textContent = 'Passwords do not match'; return; }
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        const r = await fetch('/api/admin/set-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password: pw }),
        });
        if (r.ok) { window.location.href = '/admin/dashboard'; return; }
        const d = await r.json().catch(() => ({}));
        err.textContent = d.error || 'Could not set password';
      } catch { err.textContent = 'Network error — please try again'; }
      btn.disabled = false; btn.textContent = 'Set Password & Sign In';
    }

    (async () => {
      if (!token) { showInvalid(); return; }
      try {
        const r = await fetch('/api/admin/set-password?token=' + encodeURIComponent(token));
        const d = await r.json();
        if (d.valid) showForm(d.email); else showInvalid();
      } catch { showInvalid(); }
    })();
  </script>
</body>
</html>
